[project]
name = "mcp-proton-calendar"
version = "0.1.0"
description = "MCP server for creating Proton Calendar events via ICS email"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-proton-calendar = "mcp_proton_calendar.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
